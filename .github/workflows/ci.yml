name: CI

on:
  push:
    # main is production; ui/** are the release branches that staging builds.
    branches: [main, "ui/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push cancels an older run, except on main: there every run has its own group, so a run that
  # is deploying is never cancelled halfway. The deploy job queues behind the previous deploy instead.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    # On main every job runs: the deploy job ships the whole tree, while the paths filter only sees the
    # commits of one push (a docs-only push after a failed run would otherwise deploy the failed code).
    outputs:
      backend: ${{ github.ref == 'refs/heads/main' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.ref == 'refs/heads/main' && 'true' || steps.filter.outputs.frontend }}
      mobile: ${{ github.ref == 'refs/heads/main' && 'true' || steps.filter.outputs.mobile }}
      desktop: ${{ github.ref == 'refs/heads/main' && 'true' || steps.filter.outputs.desktop }}
      server: ${{ github.ref == 'refs/heads/main' && 'true' || steps.filter.outputs.server }}
      browser: ${{ github.ref == 'refs/heads/main' && 'true' || steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              # The phone's colors are checked against these tokens (mobile/src/tests/theme-drift.test.ts).
              - 'frontend/app/globals.css'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - 'backend/**'
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            server:
              - 'backend/**'
              - 'frontend/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            browser:
              - 'desktop-image/**'
              - 'backend/app/computers/**'
              - 'backend/tests/computers/test_browser*.py'
              - '.github/workflows/ci.yml'

  browser:
    name: Isolated Chromium CDP acceptance
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
      SUPARAGENT_BROWSER_IMAGE: suparagent-browser:qa
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: docker build -t suparagent-browser:qa desktop-image
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest tests/computers/test_browser.py tests/computers/test_browser_real.py -q
        working-directory: backend

  backend-sqlite:
    name: Backend tests (SQLite)
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Pinned: on ubuntu-latest (Ubuntu 26 from 2026-10-19) test_a_hanging_and_a_crashing_engine_block_nothing
    # fails every time, because the fake Codex program is never seen running. Cause not found yet.
    # Move back to ubuntu-latest once it is.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_BACKEND: sqlite
      # Throwaway key for tests only (a valid Fernet key; protects nothing).
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install audio validation runtime
        run: |
          # Skip apt when the runner already has it; otherwise fail fast on a mirror/DNS outage instead of hanging.
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install --yes ffmpeg
          fi
          ffprobe -version
      - run: uv sync --frozen
      - run: uv run pytest -q

  sandbox-linux:
    name: Linux sandbox enforcement
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Keep the test host's namespace policy intact. Ubuntu 24.04's hosted
    # runner refused the real sandbox self-check; qualify on this host first.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install namespace runtime
        run: |
          # Skip apt when the runner already has it; otherwise fail fast on a mirror/DNS outage instead of hanging.
          if ! command -v bwrap >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install --yes bubblewrap
          fi
          bwrap --version
          uname -srmo
      - run: uv sync --frozen
      - name: Diagnose namespace availability without changing host policy
        run: |
          uv run python - <<'PY'
          import subprocess
          from app.core.config import settings
          from app.core import turn_sandbox as box
          settings.TURN_SANDBOX_ENABLED = True
          for network in (False, True):
              settings.TURN_SANDBOX_NETWORK_ENABLED = network
              result = subprocess.run(
                  [*box._base(), '--', '/bin/sh', '-c',
                   'readlink /proc/self/ns/pid; readlink /proc/self/ns/net'],
                  env={'PATH': '/usr/bin:/bin'}, capture_output=True,
                  text=True, timeout=10,
              )
              print(f'network isolation={network}, exit={result.returncode}', flush=True)
              print(result.stdout, end='', flush=True)
              print(result.stderr, end='', flush=True)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY
      - name: Require real filesystem and network enforcement
        run: |
          uv run pytest -v -rs --junitxml=../sandbox-results.xml \
            tests/core/test_turn_sandbox.py::test_real_linux_private_files_process_namespace_and_writable_workspace \
            tests/core/test_turn_egress.py::test_real_linux_network_box_blocks_host_loopback_and_gates_proxy
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('../sandbox-results.xml').iter('testcase'))
          expected = {
              'test_real_linux_private_files_process_namespace_and_writable_workspace',
              'test_real_linux_network_box_blocks_host_loopback_and_gates_proxy',
          }
          if len(cases) != 2 or {case.get('name') for case in cases} != expected:
              raise SystemExit('Expected both real Linux enforcement tests.')
          if any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('Both real Linux enforcement tests must pass without skips.')
          PY
      - name: Preserve enforcement report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: linux-sandbox-enforcement
          path: sandbox-results.xml

  backend-postgres:
    name: Backend tests (PostgreSQL)
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Pinned: on ubuntu-latest (Ubuntu 26 from 2026-10-19) test_a_hanging_and_a_crashing_engine_block_nothing
    # fails every time, because the fake Codex program is never seen running. Cause not found yet.
    # Move back to ubuntu-latest once it is.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vadoo
          POSTGRES_PASSWORD: vadoo
          POSTGRES_DB: vadoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vadoo -d vadoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      # Throwaway key for tests only (a valid Fernet key; protects nothing).
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install audio validation runtime
        run: |
          # Skip apt when the runner already has it; otherwise fail fast on a mirror/DNS outage instead of hanging.
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install --yes ffmpeg
          fi
          ffprobe -version
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  # The real backend process end to end: scratch SQLite, a fake claude CLI,
  # sign-in, an agent turn, an approval, a routine, a refused second backend,
  # SIGTERM mid-turn and a restart (scripts/smoke-backend.py, under a minute).
  backend-smoke:
    name: Backend smoke (real process)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run python ../scripts/smoke-backend.py

  # The server run mode end to end: the pages are built with a relative API path,
  # then `python -m app.server` runs on scratch SQLite and is walked through
  # migrate, sign-in through simulated proxy headers, pairing, a refused second
  # server, SIGTERM and a restart (scripts/smoke-server.py, about a minute).
  server-smoke:
    name: Server smoke (pages and API in one process)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
        working-directory: frontend
      - run: node --test scripts/build-ui.test.js
      - run: node scripts/build-ui.js
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python ../scripts/smoke-server.py --ui-dir ../frontend/out
        working-directory: backend

  frontend:
    name: Frontend lint and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:contrast
      - run: npm run build

  mobile:
    name: Mobile lint, typecheck, test and bundle
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:bundle

  desktop:
    name: Desktop node tests
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm test

  # The one check to require in branch protection. Skipped jobs (docs-only
  # changes) count as passing; failed or cancelled jobs do not.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, backend-sqlite, sandbox-linux, backend-postgres, backend-smoke, server-smoke, frontend, mobile, desktop, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            exit 1
          fi

  deploy:
    # Fully automatic release: every push to main (and a manual run on main) whose CI passes goes live.
    # The job is skipped on pull requests and other branches, so forks never see the token. It needs the
    # repository secret COOLIFY_DEPLOY_TOKEN: a Coolify API token with read and deploy rights only.
    # docs/RELEASING.md describes the flow.
    name: Deploy production
    needs: ci-gate
    # !cancelled() instead of the default success(): skipped CI jobs (paths filter) would otherwise
    # skip this job too, even with ci-gate green.
    if: ${{ !cancelled() && needs.ci-gate.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One deploy at a time; a newer one waits for the running one instead of cancelling it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://agent.lthops.tech
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Deploy with Coolify and wait until healthy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_API: https://lthops.tech/api/v1
          COOLIFY_APP: nadese5orpcwc5rl8wrtxhz8
          SITE_URL: https://agent.lthops.tech
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: main
          GITHUB_TOKEN: ${{ github.token }}
        # exec: node receives the runner's stop signal itself and can cancel an unconfirmed deployment.
        run: exec node .github/scripts/coolify-deploy.mjs
