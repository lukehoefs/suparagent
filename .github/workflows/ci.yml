name: CI

on:
  push:
    # main is production; ui/** are the release branches that staging builds.
    branches: [main, "ui/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      server: ${{ steps.filter.outputs.server }}
      browser: ${{ steps.filter.outputs.browser }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              # The phone's colors are checked against these tokens (mobile/src/tests/theme-drift.test.ts).
              - 'frontend/app/globals.css'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - 'backend/**'
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            server:
              - 'backend/**'
              - 'frontend/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            browser:
              - 'desktop-image/**'
              - 'backend/app/computers/**'
              - 'backend/tests/computers/test_browser*.py'
              - '.github/workflows/ci.yml'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'desktop-image/od-browser'
              - 'backend/app/computers/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'scripts/smoke-light-browser.py'
              - '.github/workflows/ci.yml'

  browser:
    name: Isolated Chromium CDP acceptance
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
      SUPARAGENT_BROWSER_IMAGE: suparagent-browser:qa
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: docker build -t suparagent-browser:qa desktop-image
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest tests/computers/test_browser.py tests/computers/test_browser_real.py -q
        working-directory: backend

  # The server image (Dockerfile) with its light browser: Chromium, the broker and Playwright inside the
  # image, run as the image's own user (scripts/smoke-light-browser.py).
  server-image:
    name: Server image and light browser
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - run: docker build -t suparagent:qa .
      - run: docker run --rm -v "$PWD/scripts:/smoke:ro" suparagent:qa python /smoke/smoke-light-browser.py
      - name: The server starts and answers its health check
        run: |
          key=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          docker run -d --name qa -p 127.0.0.1:8000:8000 -e TOKEN_ENCRYPTION_KEYS="$key" suparagent:qa
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/api/v1/health; then echo; docker rm -f qa; exit 0; fi
            sleep 2
          done
          docker logs qa; exit 1
      - run: docker image ls suparagent:qa

  # The backend suites run in parallel shards, whole test files each, balanced by
  # backend/tests/ci_durations.json (backend/tests/sharding.py). backend-shards
  # below checks that together they ran every test exactly once.
  backend-sqlite:
    name: Backend tests (SQLite ${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 30  # about 4 of tests, plus a cold ffmpeg install on a slow mirror
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Pinned: on ubuntu-latest (Ubuntu 26 from 2026-10-19) test_a_hanging_and_a_crashing_engine_block_nothing
    # fails every time, because the fake Codex program is never seen running. Cause not found yet.
    # Move back to ubuntu-latest once it is.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # finish every shard, so one run shows all the failures
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_BACKEND: sqlite
      # Throwaway key for tests only (a valid Fernet key; protects nothing).
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
      PYTEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      PYTEST_SHARD_REPORT: ${{ github.workspace }}/shard-report/sqlite-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # The Ubuntu mirror has served ffmpeg's packages at 130 kB/s (14 minutes), so they are kept in
      # GitHub's cache: apt then only downloads what changed since. Bump v1 to start the cache afresh.
      - name: Restore the ffmpeg packages
        id: ffmpeg-cache
        uses: actions/cache/restore@v4.2.3
        with:
          path: ~/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-v1
      - name: Install audio validation runtime
        id: ffmpeg
        run: |
          # Skip apt when the runner already has it; otherwise fail fast on a mirror/DNS outage instead of hanging.
          if ! command -v ffprobe >/dev/null; then
            mkdir -p ~/apt-ffmpeg/partial
            apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dir::Cache::Archives=$HOME/apt-ffmpeg -o APT::Keep-Downloaded-Packages=true"
            $apt update
            $apt install --yes --no-install-recommends ffmpeg
            sudo chown -R "$(id -u):$(id -g)" ~/apt-ffmpeg
            echo "installed=true" >> "$GITHUB_OUTPUT"
          fi
          ffprobe -version
      - name: Keep the ffmpeg packages for the next run
        if: steps.ffmpeg.outputs.installed == 'true' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true  # another backend shard may be saving the same key
        uses: actions/cache/save@v4.2.3
        with:
          path: ~/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-v1
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Keep the shard report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: backend-shard-sqlite-${{ matrix.shard }}
          path: shard-report/
          if-no-files-found: ignore  # backend-shards reports a missing shard
          retention-days: 14

  sandbox-linux:
    name: Linux sandbox enforcement
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Keep the test host's namespace policy intact. Ubuntu 24.04's hosted
    # runner refused the real sandbox self-check; qualify on this host first.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install namespace runtime
        run: |
          # Skip apt when the runner already has it; otherwise fail fast on a mirror/DNS outage instead of hanging.
          if ! command -v bwrap >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install --yes bubblewrap
          fi
          bwrap --version
          uname -srmo
      - run: uv sync --frozen
      - name: Diagnose namespace availability without changing host policy
        run: |
          uv run python - <<'PY'
          import subprocess
          from app.core.config import settings
          from app.core import turn_sandbox as box
          settings.TURN_SANDBOX_ENABLED = True
          for network in (False, True):
              settings.TURN_SANDBOX_NETWORK_ENABLED = network
              result = subprocess.run(
                  [*box._base(), '--', '/bin/sh', '-c',
                   'readlink /proc/self/ns/pid; readlink /proc/self/ns/net'],
                  env={'PATH': '/usr/bin:/bin'}, capture_output=True,
                  text=True, timeout=10,
              )
              print(f'network isolation={network}, exit={result.returncode}', flush=True)
              print(result.stdout, end='', flush=True)
              print(result.stderr, end='', flush=True)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY
      - name: Require real filesystem and network enforcement
        run: |
          uv run pytest -v -rs --junitxml=../sandbox-results.xml \
            tests/core/test_turn_sandbox.py::test_real_linux_private_files_process_namespace_and_writable_workspace \
            tests/core/test_turn_egress.py::test_real_linux_network_box_blocks_host_loopback_and_gates_proxy
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('../sandbox-results.xml').iter('testcase'))
          expected = {
              'test_real_linux_private_files_process_namespace_and_writable_workspace',
              'test_real_linux_network_box_blocks_host_loopback_and_gates_proxy',
          }
          if len(cases) != 2 or {case.get('name') for case in cases} != expected:
              raise SystemExit('Expected both real Linux enforcement tests.')
          if any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('Both real Linux enforcement tests must pass without skips.')
          PY
      - name: Preserve enforcement report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: linux-sandbox-enforcement
          path: sandbox-results.xml

  backend-postgres:
    name: Backend tests (PostgreSQL ${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 30  # about 5 of tests, plus a cold ffmpeg install on a slow mirror
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Pinned: on ubuntu-latest (Ubuntu 26 from 2026-10-19) test_a_hanging_and_a_crashing_engine_block_nothing
    # fails every time, because the fake Codex program is never seen running. Cause not found yet.
    # Move back to ubuntu-latest once it is.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # finish every shard, so one run shows all the failures
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vadoo
          POSTGRES_PASSWORD: vadoo
          POSTGRES_DB: vadoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vadoo -d vadoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      # Throwaway key for tests only (a valid Fernet key; protects nothing).
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
      PYTEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      PYTEST_SHARD_REPORT: ${{ github.workspace }}/shard-report/postgres-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # The Ubuntu mirror has served ffmpeg's packages at 130 kB/s (14 minutes), so they are kept in
      # GitHub's cache: apt then only downloads what changed since. Bump v1 to start the cache afresh.
      - name: Restore the ffmpeg packages
        id: ffmpeg-cache
        uses: actions/cache/restore@v4.2.3
        with:
          path: ~/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-v1
      - name: Install audio validation runtime
        id: ffmpeg
        run: |
          # Skip apt when the runner already has it; otherwise fail fast on a mirror/DNS outage instead of hanging.
          if ! command -v ffprobe >/dev/null; then
            mkdir -p ~/apt-ffmpeg/partial
            apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dir::Cache::Archives=$HOME/apt-ffmpeg -o APT::Keep-Downloaded-Packages=true"
            $apt update
            $apt install --yes --no-install-recommends ffmpeg
            sudo chown -R "$(id -u):$(id -g)" ~/apt-ffmpeg
            echo "installed=true" >> "$GITHUB_OUTPUT"
          fi
          ffprobe -version
      - name: Keep the ffmpeg packages for the next run
        if: steps.ffmpeg.outputs.installed == 'true' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true  # another backend shard may be saving the same key
        uses: actions/cache/save@v4.2.3
        with:
          path: ~/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-v1
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - name: Keep the shard report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: backend-shard-postgres-${{ matrix.shard }}
          path: shard-report/
          if-no-files-found: ignore  # backend-shards reports a missing shard
          retention-days: 14

  # Every backend shard reports what it collected, kept and ran. Together they must
  # have run each collected test exactly once, on SQLite and on PostgreSQL. The job
  # summary shows each shard's tests, results and test seconds. To rebalance the
  # shards, download a run's backend-shard-* artifacts into one folder and run
  #   python backend/tests/sharding.py durations <folder> > backend/tests/ci_durations.json
  backend-shards:
    name: Backend shards ran every test once
    needs: [changes, backend-sqlite, backend-postgres]
    if: always() && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: backend/tests/sharding.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: backend-shard-*
          path: shard-reports
      - run: python3 -I backend/tests/sharding.py check shard-reports sqlite postgres

  # The real backend process end to end: scratch SQLite, a fake claude CLI,
  # sign-in, an agent turn, an approval, a routine, a refused second backend,
  # SIGTERM mid-turn and a restart (scripts/smoke-backend.py, under a minute).
  backend-smoke:
    name: Backend smoke (real process)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run python ../scripts/smoke-backend.py

  # The server run mode end to end: the pages are built with a relative API path,
  # then `python -m app.server` runs on scratch SQLite and is walked through
  # migrate, sign-in through simulated proxy headers, pairing, a refused second
  # server, SIGTERM and a restart (scripts/smoke-server.py, about a minute).
  server-smoke:
    name: Server smoke (pages and API in one process)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
        working-directory: frontend
      - run: node --test scripts/build-ui.test.js
      - run: node scripts/build-ui.js
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python ../scripts/smoke-server.py --ui-dir ../frontend/out
        working-directory: backend

  frontend:
    name: Frontend lint and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:contrast
      - run: npm run build

  mobile:
    name: Mobile lint, typecheck, test and bundle
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:bundle

  desktop:
    name: Desktop node tests
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm test

  # The one check to require in branch protection. Skipped jobs (docs-only
  # changes) count as passing; failed or cancelled jobs do not.
  ci-gate:
    name: ci-gate
    if: always()
    # A matrix job's result is failure when any of its shards failed.
    needs: [changes, backend-sqlite, sandbox-linux, backend-postgres, backend-shards, backend-smoke, server-smoke, frontend, mobile, desktop, browser, server-image]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            exit 1
          fi
